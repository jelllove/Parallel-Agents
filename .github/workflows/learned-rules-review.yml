name: Learned-rule PR review

# Recurring, advisory review on every pull request: changed files are checked against the
# active rules in .github/agent-rules/learned-rules.json. It reports only; it never blocks,
# pushes, or edits the pull request.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learned-rules-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review changed files against active learned rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Review changed files
        run: node scripts/review-learned-rules.mjs --base "origin/${{ github.base_ref || 'main' }}"
      - name: Retain review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learned-rules-review
          path: reports/learned-rules-review/
          retention-days: 14
          if-no-files-found: warn
